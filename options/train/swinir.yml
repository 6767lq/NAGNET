name: train_SwinIR
model_type: SRModel
scale: 1
num_gpu: auto
manual_seed: 0

# dataset and data loader settings
datasets:
  train:

    name: ImageNet
    type: ImageNetPairedDataset
    dataroot_gt:
    dataroot_lq:
    meta_info_file: hat/data/meta_info/meta_info_ImageNet_GT.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 2
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: Set5
    type: ImageNetPairedDataset
    dataroot_gt: F:\val\xingaoyi\clean
    dataroot_lq: F:\val\xingaoyi\noise2

    io_backend:
      type: disk



# network structures
network_g:
  type: SwinIR
  upscale: 2
  in_chans: 1
  img_size: 128
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
#  depths: [ 6, 6, 6, 6 ]
#  embed_dim: 180
#  num_heads: [ 6, 6, 6, 6 ]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# path
path:
#  pretrain_network_g: D:\lq\HAT-main\experiments\train_SwinIR\models\net_g_98000.pth
#  strict_load_g: true
#  resume_state: D:\lq\HAT-main\experiments\train_SwinIR\training_states\98000.state
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    gamma: 0.5

  total_iter: 500000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
# validation settings
val:
  val_freq: 4000
  save_img: true

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: 4000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
