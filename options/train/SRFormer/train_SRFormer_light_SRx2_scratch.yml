# general settings
name: train_SRFormer_xingaoyi_fenzhi
model_type: SRModel

scale: 2
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
#    name: DIV2K
#    type: PairedImageDataset
#    dataroot_gt: datasets/DIV2K/DIV2K_train_HR
#    dataroot_lq: datasets/DIV2K/DIV2K_train_LR_bicubic/X2
    name: ImageNet
    type: ImageNetPairedDataset
    #    dataroot_gt: datasets/ImageNet/GT
    dataroot_gt: F:\xinggaoyi
    dataroot_lq: F:\xinggaoyi
#    dataroot_gt: F:\fastmri\crop
#    dataroot_lq: F:\fastmri\crop
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~



#    name: Set5
#    type: PairedImageDataset
#    dataroot_gt: ./datasets/Set5/x2HR
#    dataroot_lq: ./datasets/Set5/x2LR
  val:
    name: Set5
    type: ImageNetPairedDataset
    dataroot_gt: F:\val\clean2
    dataroot_lq: F:\val\noise2
#    dataroot_gt: F:\val\xingaoyi\clean
#    dataroot_lq: F:\val\xingaoyi\noise
#    dataroot_gt: F:\val\fault
#    dataroot_lq: F:\val\fault
    io_backend:
      type: disk

# network structures
network_g:
  type: SRFormer_fenzhi
  upscale: 2
  in_chans: 1
  img_size: 128
  window_size: 16
  img_range: 1.
  depths: [6, 6, 6, 6]
  embed_dim: 60
  num_heads: [6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'


print_network: false
# path
path:
#  pretrain_network_g: ~
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    gamma: 0.5

  total_iter: 500000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: 4000
  save_img: true

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: 4000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

