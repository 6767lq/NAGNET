# network structures
network_g:
  type: MSRResNet
  num_in_ch: 1
  num_out_ch: 1
  num_feat: 64
  num_block: 16
  upscale: 2

# path
path:
  pretrain_network_g: D:\lq\HAT-main\experiments\004_MSRGAN_x4_f64b16_DIV2K_400k_B16G1_wandb\models\net_g_160000.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
